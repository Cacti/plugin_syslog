name: "PHPStan Static Analysis"

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # Run PHPStan analysis weekly on Mondays at 00:00 UTC
    - cron: '0 0 * * 1'

jobs:
  phpstan:
    name: PHPStan Analysis
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup PHP ${{ matrix.php }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: intl, mysql, gd, ldap, gmp, xml, curl, json, mbstring
        coverage: none

    - name: Install Composer dependencies
      run: |
        if [ -f composer.json ]; then
          composer install --prefer-dist --no-progress --no-suggest
        fi

    - name: Create PHPStan config if not exists
      run: |
        if [ ! -f phpstan.neon ]; then
          cat > phpstan.neon << 'EOF'
        parameters:
          level: 5
          paths:
            - .
          excludePaths:
            - vendor/
            - locales/
        EOF
        fi

    - name: Install PHPStan
      run: composer require --dev phpstan/phpstan --with-all-dependencies || composer global require phpstan/phpstan

    - name: Run PHPStan
      run: |
        if [ -f vendor/bin/phpstan ]; then
          vendor/bin/phpstan analyse --no-progress --error-format=github || true
        else
          phpstan analyse --no-progress --error-format=github || true
        fi
      continue-on-error: true
