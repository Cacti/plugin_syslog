name: PHP Lint (Code Style)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  php-cs:
    runs-on: ubuntu-latest
    
    name: PHP CodeSniffer
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: intl, mysql, gd, ldap, gmp, xml, curl, json, mbstring
        coverage: none
    
    - name: Install PHP_CodeSniffer
      run: composer global require squizlabs/php_codesniffer
    
    - name: Create phpcs.xml if not exists
      run: |
        if [ ! -f phpcs.xml ]; then
          cat > phpcs.xml << 'EOF'
        <?xml version="1.0"?>
        <ruleset name="Syslog Plugin">
            <description>Coding standards for Cacti Syslog Plugin</description>
            
            <file>.</file>
            
            <exclude-pattern>*/vendor/*</exclude-pattern>
            <exclude-pattern>*/locales/*</exclude-pattern>
            <exclude-pattern>*.js</exclude-pattern>
            
            <arg name="extensions" value="php"/>
            <arg name="colors"/>
            <arg value="p"/>
            
            <rule ref="PSR12">
                <exclude name="PSR1.Files.SideEffects"/>
                <exclude name="PSR12.Files.FileHeader"/>
            </rule>
        </ruleset>
        EOF
        fi
    
    - name: Run PHP CodeSniffer
      run: |
        export PATH="$HOME/.composer/vendor/bin:$PATH"
        phpcs --standard=phpcs.xml --report=checkstyle --report-file=phpcs-report.xml . || true
        phpcs --standard=phpcs.xml .
      continue-on-error: true
