name: PHP Lint

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  php-lint:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3']
    
    name: PHP ${{ matrix.php }} Lint
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup PHP ${{ matrix.php }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: intl, mysql, gd, ldap, gmp, xml, curl, json, mbstring
        coverage: none
    
    - name: Install parallel-lint
      run: composer global require php-parallel-lint/php-parallel-lint
    
    - name: Run parallel-lint
      run: |
        export PATH="$HOME/.composer/vendor/bin:$PATH"
        parallel-lint --exclude vendor --exclude locales/LC_MESSAGES .
