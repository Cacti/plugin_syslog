name: "PHPStan Static Analysis"

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # Run PHPStan analysis weekly on Mondays at 00:00 UTC
    - cron: '0 0 * * 1'

jobs:
  phpstan:
    name: PHPStan Analysis
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup PHP ${{ matrix.php }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: intl, mysql, gd, ldap, gmp, xml, curl, json, mbstring
        coverage: none

    - name: Install Composer dependencies
      run: |
        if [ -f composer.json ]; then
          composer install --prefer-dist --no-progress --no-suggest
        fi

    - name: Create PHPStan config if not exists
      run: |
        if [ ! -f phpstan.neon ]; then
          cat > phpstan.neon << 'EOF'
        parameters:
          level: 5
          paths:
            - .
          excludePaths:
            - vendor/
            - locales/
          ignoreErrors:
            - '#Function db_[a-z_]+ not found\.#'
            - '#Function cacti_[a-z_]+ not found\.#'
            - '#has invalid return type the\.#'
            - '#Class [a-zA-Z_\\]+ not found\.#'
          bootstrapFiles:
            - .github/workflows/phpstan-bootstrap.php
        EOF
        fi

    - name: Create PHPStan bootstrap for Cacti functions
      run: |
        mkdir -p .github/workflows
        cat > .github/workflows/phpstan-bootstrap.php << 'EOF'
        <?php
        // PHPStan bootstrap file for Cacti plugin functions
        // These functions are provided by the main Cacti application
        
        if (!function_exists('db_connect_real')) {
            function db_connect_real(string $host, string $user, string $pass, string $db, string $type, int $port = 0, int $ssl = false, int $ssl_ca = '', int $ssl_cert = '', int $ssl_key = '') {}
        }
        if (!function_exists('db_close')) {
            function db_close(&$link = null): bool { return true; }
        }
        if (!function_exists('db_execute')) {
            function db_execute(string $sql, bool $log = true, int $db_conn = 0): bool { return true; }
        }
        if (!function_exists('db_execute_prepared')) {
            function db_execute_prepared(string $sql, array $params = [], bool $log = true, int $db_conn = 0): bool { return true; }
        }
        if (!function_exists('db_fetch_cell')) {
            function db_fetch_cell(string $sql, string $col_name = '', bool $log = true, int $db_conn = 0) { return ''; }
        }
        if (!function_exists('db_fetch_cell_prepared')) {
            function db_fetch_cell_prepared(string $sql, array $params = [], string $col_name = '', bool $log = true, int $db_conn = 0) { return ''; }
        }
        if (!function_exists('db_fetch_row')) {
            function db_fetch_row(string $sql, bool $log = true, int $db_conn = 0): array { return []; }
        }
        if (!function_exists('db_fetch_row_prepared')) {
            function db_fetch_row_prepared(string $sql, array $params = [], bool $log = true, int $db_conn = 0): array { return []; }
        }
        if (!function_exists('db_fetch_assoc')) {
            function db_fetch_assoc(string $sql, bool $log = true, int $db_conn = 0): array { return []; }
        }
        if (!function_exists('db_fetch_assoc_prepared')) {
            function db_fetch_assoc_prepared(string $sql, array $params = [], bool $log = true, int $db_conn = 0): array { return []; }
        }
        if (!function_exists('cacti_log')) {
            function cacti_log(string $message, bool $output = false, string $environ = 'CMDPHP', int $level = 0): void {}
        }
        if (!function_exists('cacti_sizeof')) {
            function cacti_sizeof($array): int { return is_array($array) ? count($array) : 0; }
        }
        EOF

    - name: Install PHPStan
      run: composer require --dev phpstan/phpstan --with-all-dependencies || composer global require phpstan/phpstan

    - name: Run PHPStan
      run: |
        if [ -f vendor/bin/phpstan ]; then
          vendor/bin/phpstan analyse --no-progress --error-format=github || true
        else
          phpstan analyse --no-progress --error-format=github || true
        fi
      continue-on-error: true
